<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Painel de Governança Comercial" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Governança Comercial</title>
    <link rel="stylesheet" href="./styles/styles.css" />
    <link rel="stylesheet" href="./styles/login.css" />
  </head>
  <body>
    <div id="login" class="login-shell" hidden>
      <form id="login-form" class="login-card" autocomplete="on">
        <div class="brand"><span class="brand-mark">GC</span><div><strong>Governança Comercial</strong><small>DNA de Vendas</small></div></div>
        <h1>Entrar</h1>
        <p class="login-hint">Use o e-mail cadastrado pelo consultor responsável.</p>
        <label><span>E-mail</span><input id="login-email" type="email" name="email" required autocomplete="username" /></label>
        <label><span>Senha</span><input id="login-password" type="password" name="password" required autocomplete="current-password" /></label>
        <button id="login-button" class="button primary" type="submit">Entrar</button>
        <p id="login-error" class="login-error" role="alert" hidden></p>
      </form>
    </div>

    <div id="loading" class="loading-shell" hidden><div class="loading-card"><span class="save-dot"></span><span id="loading-text">Carregando dados…</span></div></div>

    <div id="app" class="app-shell" hidden>
      <aside class="sidebar">
        <div class="brand">
          <span class="brand-mark">GC</span>
          <div><strong id="brand-name">Governança</strong><small>Governança Comercial</small></div>
        </div>
        <p class="nav-label">Workspace</p>
        <nav id="nav" aria-label="Navegação principal"></nav>
        <div class="sidebar-footer">
          <span class="user-avatar">GC</span>
          <div class="user-copy"><strong id="user-name">—</strong><small id="user-role">—</small><span id="save-status">Dados carregados</span></div>
          <button id="logout-button" class="icon-button" type="button" title="Sair" aria-label="Sair">⎋</button>
        </div>
      </aside>
      <main class="workspace">
        <header class="topbar">
          <div class="page-heading">
            <p class="eyebrow"><span id="eyebrow-client">GOVERNANÇA COMERCIAL</span></p>
            <h1 id="page-title">Dashboard Gerencial</h1>
            <p id="page-subtitle" class="page-subtitle">Visão consolidada do desempenho comercial.</p>
          </div>
          <div class="top-actions-wrap">
            <div class="top-actions">
              <label><span>Ano</span><select id="year-control"></select></label>
              <label><span>Período</span><select id="month-control"></select></label>
              <label><span>Responsável</span><select id="executive-control"></select></label>
            </div>
            <div class="topbar-utilities" aria-label="Status e ações">
              <span id="top-save-status" class="save-pill"><span class="save-dot"></span>Dados carregados</span>
              <button id="undo-button" class="button secondary compact" type="button" disabled>Desfazer</button>
            </div>
          </div>
        </header>
        <section id="alerts" aria-live="polite"></section>
        <section id="content" class="content"></section>
      </main>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script type="module" src="./app/main.js"></script>
  </body>
</html>
